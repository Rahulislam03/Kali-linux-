<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web-kali-linux | Pro Terminal OS</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: -1; opacity: 0.3; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #00ff41; z-index: 10; position: relative; }
        .login-box { border: 1px solid #00ff41; padding: 30px; background: rgba(0,0,0,0.8); box-shadow: 0 0 20px #00ff41; text-align: center; }
        
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; margin: 10px; cursor: pointer; font-weight: bold; font-family: inherit; }
        
        #terminal { display: none; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; overflow-y: auto; color: #00ff41; z-index: 5; position: relative; background: rgba(0,0,0,0.7); }
        .output { margin-bottom: 5px; white-space: pre-wrap; word-wrap: break-word; }
        .input-line { display: flex; align-items: center; }
        #cmdInput { border: none; background: transparent; color: #00ff41; outline: none; flex: 1; font-family: inherit; font-size: 16px; }
        .user-prefix { color: #55ff55; font-weight: bold; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="login-screen">
        <div class="login-box">
            <h1>SYSTEM AUTHENTICATION</h1>
            <button onclick="googleLogin()">LOGIN WITH GOOGLE</button>
            <p style="font-size: 10px;">AUTHORIZED ACCESS ONLY</p>
        </div>
    </div>

    <div id="terminal">
        <div id="history"></div>
        <div class="input-line">
            <span class="user-prefix"><span id="username-display">guest</span>@mixveo:~$ &nbsp;</span>
            <input type="text" id="cmdInput" autofocus autocomplete="off">
        </div>
    </div>

    <audio id="typeSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>

    <script type="module">
        // Firebase Setup
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55EOqdZRur1zfWSc2pNrXO0yncP3kz74",
            authDomain: "kali-linux-terminal-dd03c.firebaseapp.com",
            projectId: "kali-linux-terminal-dd03c",
            storageBucket: "kali-linux-terminal-dd03c.firebasestorage.app",
            messagingSenderId: "205004830636",
            appId: "1:205004830636:web:cfbb3ff118d2a42e002c09",
            measurementId: "G-08CFT7E314"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.googleLogin = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                startTerminal(result.user.displayName);
            } catch (err) { alert("Auth Failed: " + err.message); }
        };
    </script>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        const terminal = document.getElementById('terminal');
        const loginScreen = document.getElementById('login-screen');
        const historyDiv = document.getElementById('history');
        const cmdInput = document.getElementById('cmdInput');
        const typeSound = document.getElementById('typeSound');

        // 1. Matrix Background Effect
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // 2. Command History & IP Tracking
        let commandHistory = [];
        let historyIndex = -1;
        let currentUser = "guest";

        async function startTerminal(name) {
            currentUser = name.toLowerCase().replace(/\s+/g, '');
            document.getElementById('username-display').innerText = currentUser;
            loginScreen.style.display = 'none';
            terminal.style.display = 'block';
            
            // Welcome Voice
            const speech = new SpeechSynthesisUtterance(`Welcome back, ${name}. Accessing Mixveo Mainframe.`);
            speech.pitch = 0.4; speech.rate = 0.8;
            window.speechSynthesis.speak(speech);

            printOutput("System: Initializing...");
            // IP Trace
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                printOutput(`Trace: Connected from ${data.ip} (${data.city}, ${data.country_name})`);
            } catch (e) { printOutput("Trace: Secure VPN detected. Location masked."); }
        }

        // 3. Command Logic
        cmdInput.addEventListener('keydown', (e) => {
            // Typing Sound
            typeSound.currentTime = 0;
            typeSound.play();

            if (e.key === 'Enter') {
                const cmd = cmdInput.value.trim();
                if (cmd) {
                    commandHistory.push(cmd);
                    historyIndex = commandHistory.length;
                    executeCommand(cmd);
                }
                cmdInput.value = "";
            } else if (e.key === 'ArrowUp') {
                if (historyIndex > 0) {
                    historyIndex--;
                    cmdInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cmdInput.value = "";
                }
            }
        });

        function executeCommand(cmd) {
            printOutput(`${currentUser}@mixveo:~$ ${cmd}`);
            const parts = cmd.toLowerCase().split(" ");
            const mainCmd = parts[0];

            switch(mainCmd) {
                case 'help':
                    printOutput("COMMANDS: ls, cat, clear, whoami, ifconfig, neofetch, exit");
                    break;
                case 'ls':
                    printOutput("mixveo_bio.txt   projects.sh   secret_keys.enc");
                    break;
                case 'whoami':
                    printOutput(`User: ${currentUser}\nPrivilege: Root/Admin\nSystem: Mixveo OS`);
                    break;
                case 'ifconfig':
                    printOutput("eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST> mtu 1500\ninet 192.168.0.1  netmask 255.255.255.0");
                    break;
                case 'neofetch':
                    printOutput("  MMMMMMMMMMMMMMMMMMMMMMMM  \n  MM   Mixveo Terminal   MM  \n  MM   OS: Mixveo Linux  MM  \n  MM   Kernel: 5.15.0    MM  \n  MM   Shell: bash 5.1   MM  ");
                    break;
                case 'clear':
                    historyDiv.innerHTML = "";
                    break;
                case 'exit':
                    location.reload();
                    break;
                default:
                    printOutput(`bash: ${mainCmd}: command not found`);
            }
            terminal.scrollTop = terminal.scrollHeight;
        }

        function printOutput(text) {
            const div = document.createElement('div');
            div.className = "output";
            div.innerText = text;
            historyDiv.appendChild(div);
        }
    </script>
</body>
</html>
