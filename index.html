<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ROOT OS | Secure Gateway</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .gate-container { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; }
        .door-box { width: 220px; height: 320px; border: 2px solid #00ff41; position: relative; perspective: 1000px; cursor: pointer; }
        .door { position: absolute; width: 100%; height: 100%; background: #001a00; border-right: 2px solid #00ff41; transform-origin: left; transition: 1.2s; z-index: 2; display: flex; align-items: center; justify-content: center; }
        .door.open { transform: rotateY(-110deg); }
        .auth-buttons { margin-top: 40px; display: flex; gap: 20px; z-index: 10; }
        .btn-gate { background: transparent; color: #00ff41; border: 1px solid #00ff41; padding: 12px 30px; cursor: pointer; font-weight: bold; }
        .btn-gate:hover { background: #00ff41; color: #000; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="gate-container">
        <div class="door-box" id="portal">
            <div class="door" id="door-element"><span>LOCKED</span></div>
            <div style="color: #00ff41; padding: 50px; text-align: center;">ENTERING SYSTEM...</div>
        </div>
        <div class="auth-buttons">
            <button class="btn-gate" id="loginBtn">LOG IN / SIGN UP</button>
        </div>
        <p id="status" style="color: #444; margin-top: 20px; letter-spacing: 2px;">AUTHENTICATION REQUIRED</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55EOqdZRur1zfWSc2pNrXO0yncP3kz74",
            authDomain: "kali-linux-terminal-dd03c.firebaseapp.com",
            projectId: "kali-linux-terminal-dd03c",
            storageBucket: "kali-linux-terminal-dd03c.firebasestorage.app",
            messagingSenderId: "205004830636",
            appId: "1:205004830636:web:cfbb3ff118d2a42e002c09",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('door-element').classList.add('open');
                document.getElementById('status').innerText = "AUTHORIZED! ACCESSING DASHBOARD...";
                setTimeout(() => window.location.href = "dashboard.html", 1500);
            }
        });

        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);
    </script>
</body>
</html>
