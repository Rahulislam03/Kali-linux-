<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT OS | Secure Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
    <canvas id="matrix"></canvas>
    <div id="login-screen">
        <div class="login-box">
            <h1 class="glitch">ROOT OS</h1>
            <p id="status-text">SYSTEM STATUS: AWAITING AUTH</p>
            <div class="auth-group">
                <button class="auth-btn" id="loginBtn">LOG IN</button>
                <button class="auth-btn signup" id="signupBtn">SIGN UP</button>
            </div>
            <p class="footer-text">RESTRICTED ACCESS ONLY</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55EOqdZRur1zfWSc2pNrXO0yncP3kz74",
            authDomain: "kali-linux-terminal-dd03c.firebaseapp.com",
            projectId: "kali-linux-terminal-dd03c",
            storageBucket: "kali-linux-terminal-dd03c.firebasestorage.app",
            messagingSenderId: "205004830636",
            appId: "1:205004830636:web:cfbb3ff118d2a42e002c09",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = "dashboard.html";
        });

        const handleAuth = async () => {
            document.getElementById('status-text').innerText = "CONNECTING...";
            try { await signInWithPopup(auth, provider); } catch (e) { document.getElementById('status-text').innerText = "ERROR"; }
        };

        document.getElementById('loginBtn').onclick = handleAuth;
        document.getElementById('signupBtn').onclick = handleAuth;
    </script>
    <script src="assets/js/matrix.js"></script>
</body>
</html>
