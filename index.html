<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root OS | Auth Gateway</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #00ff41; z-index: 10; position: relative; }
        .login-box { border: 1px solid #00ff41; padding: 40px; background: rgba(0, 10, 0, 0.95); text-align: center; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 0 20px rgba(0,255,65,0.2); }
        .btn-group { display: flex; gap: 10px; margin-top: 30px; }
        .auth-btn { flex: 1; background: transparent; color: #00ff41; border: 1px solid #00ff41; padding: 12px; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.3s; }
        .auth-btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 15px #00ff41; }
        .signup-btn { background: rgba(0, 255, 65, 0.1); }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="login-screen">
        <div class="login-box">
            <h1 style="letter-spacing: 8px;">ROOT OS</h1>
            <p id="status-text" style="font-size: 12px; color: #888;">AWAITING AUTHORIZATION...</p>
            
            <div class="btn-group">
                <button class="auth-btn" id="loginBtn">LOG IN</button>
                <button class="auth-btn signup-btn" id="signupBtn">SIGN UP</button>
            </div>

            <p style="font-size: 10px; color: #444; margin-top: 25px;">RESTRICTED ACCESS ONLY</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55EOqdZRur1zfWSc2pNrXO0yncP3kz74",
            authDomain: "kali-linux-terminal-dd03c.firebaseapp.com",
            projectId: "kali-linux-terminal-dd03c",
            storageBucket: "kali-linux-terminal-dd03c.firebasestorage.app",
            messagingSenderId: "205004830636",
            appId: "1:205004830636:web:cfbb3ff118d2a42e002c09",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // সেশন ম্যানেজমেন্ট: অলরেডি লগইন থাকলে ড্যাশবোর্ডে যাবে
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        // লগইন এবং সাইনআপ উভয় ক্ষেত্রেই গুগল পপ-আপ ব্যবহার করা হয়েছে (সবচেয়ে সহজ ও নিরাপদ)
        const handleAuth = async () => {
            document.getElementById('status-text').innerText = "CONNECTING TO CLOUD...";
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                document.getElementById('status-text').innerText = "AUTH FAILED";
            }
        };

        document.getElementById('loginBtn').onclick = handleAuth;
        document.getElementById('signupBtn').onclick = handleAuth;
    </script>

    <script src="assets/js/matrix.js"></script> </body>
</html>
