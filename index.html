<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web-kali-linux | Root Terminal</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; opacity: 0.2; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #00ff41; z-index: 10; position: relative; }
        .login-box { border: 1px solid #00ff41; padding: 30px; background: rgba(0,0,0,0.9); box-shadow: 0 0 20px #00ff41; text-align: center; }
        
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; margin: 10px; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.3s; }
        button:hover { background: #008f11; color: #fff; }
        
        #terminal { display: none; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; overflow-y: auto; color: #00ff41; z-index: 5; position: relative; background: rgba(0,0,0,0.8); }
        .output { margin-bottom: 5px; white-space: pre-wrap; line-height: 1.2; text-shadow: 0 0 5px #00ff41; }
        .input-line { display: flex; align-items: center; }
        #cmdInput { border: none; background: transparent; color: #00ff41; outline: none; flex: 1; font-family: inherit; font-size: 16px; caret-color: #00ff41; }
        .prompt-text { color: #ff5555; font-weight: bold; } /* root in red like Kali */
        .user-text { color: #55ff55; font-weight: bold; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="login-screen">
        <div class="login-box">
            <h1 style="letter-spacing: 5px;">ACCESS RESTRICTED</h1>
            <p>Please authenticate to unlock Root access</p>
            <button onclick="googleLogin()">LOGIN WITH GOOGLE</button>
            <div style="font-size: 10px; margin-top: 10px; color: #888;">System: Mixveo v2.4.0</div>
        </div>
    </div>

    <div id="terminal">
        <div id="history"></div>
        <div class="input-line">
            <span class="prompt-text">root@</span><span id="username-display" class="user-text">guest</span><span style="color:#fff;">:~$</span> &nbsp;
            <input type="text" id="cmdInput" autofocus autocomplete="off">
        </div>
    </div>

    <audio id="typeSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55EOqdZRur1zfWSc2pNrXO0yncP3kz74",
            authDomain: "kali-linux-terminal-dd03c.firebaseapp.com",
            projectId: "kali-linux-terminal-dd03c",
            storageBucket: "kali-linux-terminal-dd03c.firebasestorage.app",
            messagingSenderId: "205004830636",
            appId: "1:205004830636:web:cfbb3ff118d2a42e002c09",
            measurementId: "G-08CFT7E314"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.googleLogin = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                startTerminal(result.user.displayName);
            } catch (err) { alert("Auth Failed: " + err.message); }
        };
    </script>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        const terminal = document.getElementById('terminal');
        const loginScreen = document.getElementById('login-screen');
        const historyDiv = document.getElementById('history');
        const cmdInput = document.getElementById('cmdInput');
        const typeSound = document.getElementById('typeSound');

        // Matrix Rain Logic
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const alphabet = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // Command History
        let commandHistory = [];
        let historyIndex = -1;
        let currentUser = "guest";

        async function startTerminal(name) {
            currentUser = name.toLowerCase().split(' ')[0]; // প্রথম নাম নিবে
            document.getElementById('username-display').innerText = currentUser;
            loginScreen.style.display = 'none';
            terminal.style.display = 'block';
            cmdInput.focus();
            
            const speech = new SpeechSynthesisUtterance(`Access granted. Welcome back, agent ${currentUser}.`);
            speech.pitch = 0.5; speech.rate = 0.9;
            window.speechSynthesis.speak(speech);

            printOutput("System Booting... [OK]");
            printOutput("Firewall Status: Bypassed");
            
            // Location Trace
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                printOutput(`Connection: ${data.ip} - ${data.city}, ${data.country_name}`);
            } catch (e) { printOutput("Warning: VPN active. IP Hidden."); }
        }

        cmdInput.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== 'ArrowUp' && e.key !== 'ArrowDown') {
                typeSound.currentTime = 0;
                typeSound.play();
            }

            if (e.key === 'Enter') {
                const cmd = cmdInput.value.trim();
                if (cmd) {
                    commandHistory.push(cmd);
                    historyIndex = commandHistory.length;
                    executeCommand(cmd);
                }
                cmdInput.value = "";
            } else if (e.key === 'ArrowUp') {
                if (historyIndex > 0) {
                    historyIndex--;
                    cmdInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cmdInput.value = "";
                }
            }
        });

        function executeCommand(cmd) {
            const outputLine = document.createElement('div');
            outputLine.innerHTML = `<span class="prompt-text">root@</span><span class="user-text">${currentUser}</span><span style="color:#fff;">:~$</span> ${cmd}`;
            historyDiv.appendChild(outputLine);

            const mainCmd = cmd.toLowerCase().split(" ")[0];

            switch(mainCmd) {
                case 'help':
                    printOutput("Core Commands: ls, cat, neofetch, ifconfig, clear, whoami, exit");
                    break;
                case 'ls':
                    printOutput("drwxr-xr-x  mixveo_data/\n-rw-r--r--  config.json\n-rwx------  secret.sh");
                    break;
                case 'whoami':
                    printOutput(`Current User: root\nIdentity: ${currentUser}\nAccess: Total Administrative Control`);
                    break;
                case 'ifconfig':
                    printOutput("eth0: 192.168.1.45  netmask 255.255.255.0\nStatus: Stealth Mode Active");
                    break;
                case 'neofetch':
                    printOutput(`       .---.       OS: web kali linux Linux v2.4\n      /     \\      Kernel: 6.1.0-kali-amd64\n      | () () |     Shell: bash 5.2\n       \\  ^  /      Uptime: 24h 7m\n        |||||       User: root@${currentUser}`);
                    break;
                case 'clear':
                    historyDiv.innerHTML = "";
                    break;
                case 'exit':
                    location.reload();
                    break;
                default:
                    printOutput(`bash: ${mainCmd}: command not found. Type 'help'.`);
            }
            terminal.scrollTop = terminal.scrollHeight;
        }

        function printOutput(text) {
            const div = document.createElement('div');
            div.className = "output";
            div.innerText = "> " + text;
            historyDiv.appendChild(div);
        }
    </script>
</body>
</html>
