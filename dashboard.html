<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolHub | Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        :root { --bg: #f8f9fa; --card: #ffffff; --text: #1a1a1a; --primary: #007bff; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        header { background: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 10; }
        .profile { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .profile img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--primary); }
        
        .main-content { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        /* Tool Card Design */
        .tool-card { background: var(--card); border-radius: 15px; padding: 25px; border: 1px solid #eee; transition: 0.3s; text-decoration: none; color: inherit; display: block; }
        .tool-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-color: var(--primary); }
        .tool-icon { width: 50px; height: 50px; background: #e7f1ff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 15px; }
        .tool-card h3 { margin: 0 0 10px 0; font-size: 18px; }
        .tool-card p { font-size: 14px; color: #666; margin: 0; }

        .logout-btn { background: #ff4d4d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 20px; font-weight: 900; color: var(--primary);">TOOL<span style="color: #000;">HUB</span></div>
        <div class="profile" onclick="window.location.href='pages/admin.html'">
            <span id="uName" style="font-weight: bold;">Agent</span>
            <img id="uPic" src="" alt="">
            <button class="logout-btn" id="logoutBtn" style="margin-left: 15px;">Logout</button>
        </div>
    </header>

    <div class="main-content">
        <h2 style="margin-bottom: 30px;">Discover Your Tools</h2>
        <div class="grid" id="toolGrid">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { /* আপনার কনফিগ */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('uName').innerText = user.displayName;
                document.getElementById('uPic').src = user.photoURL;
                loadTools();
            } else { window.location.href = "index.html"; }
        });

        async function loadTools() {
            const res = await fetch("https://raw.githubusercontent.com/Rahulislam03/Kali-linux-/main/services.json");
            const tools = await res.json();
            const grid = document.getElementById('toolGrid');
            grid.innerHTML = tools.map(tool => `
                <a href="${tool.url}" target="_blank" class="tool-card">
                    <div class="tool-icon">🛠️</div>
                    <h3>${tool.name}</h3>
                    <p>${tool.description || "Click to access this automation tool."}</p>
                </a>
            `).join('');
        }

        document.getElementById('logoutBtn').onclick = () => signOut(auth);
    </script>
</body>
</html>
