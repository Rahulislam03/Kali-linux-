<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ROOT OS | Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <canvas id="matrix"></canvas>
    <div id="main-container">
        <div id="top-bar">
            <div class="sys-title">TERMINAL_CORE_V5.0</div>
            <div class="user-info" onclick="window.location.href='pages/admin.html'">
                <span id="u-name">...</span>
                <img id="u-pic" src="" alt="P">
            </div>
        </div>

        <div id="terminal">
            <div id="history"></div>
        </div>

        <div id="menu-container">
            <div class="button-grid" id="tool-grid">
                <div class="loader">Syncing Modules...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { initTerminal } from "./assets/js/terminal.js";

        const firebaseConfig = { /* Sames as index.html */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('u-name').innerText = user.displayName;
                document.getElementById('u-pic').src = user.photoURL;
                initTerminal();
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
    <script src="assets/js/matrix.js"></script>
</body>
</html>
