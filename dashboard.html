<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tool Directory | Discover Resources</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header>
    <div class="logo" style="font-weight: 900; font-size: 24px;">TOOOLS<span style="color: blue;">.</span></div>
    <div class="user-info" id="logoutBtn" style="cursor: pointer;">Logout</div>
</header>

<div class="categories">
    <button class="cat-btn active">All Tools</button>
    <button class="cat-btn">Design</button>
    <button class="cat-btn">Coding</button>
    <button class="cat-btn">Marketing</button>
</div>

<main class="tools-grid" id="tool-grid">
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { loadTools } from "./assets/js/terminal.js";

    const firebaseConfig = { /* Your Config */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (user) { loadTools(); } 
        else { window.location.href = "index.html"; }
    });

    document.getElementById('logoutBtn').onclick = () => signOut(auth);
</script>

</body>
</html>
